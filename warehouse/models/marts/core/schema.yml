version: 2

models:
  - name: dim_customers
    description: SCD Type 2 customer dimension. One row per customer version.
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]

  - name: dim_products
    columns:
      - name: product_sk
        tests: [unique, not_null]

  - name: dim_stores
    columns:
      - name: store_sk
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fact_order_items
    description: Grain -- one row per order line item.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id
